    <circle cx="600" cy="470" r="250"/><circle cx="600" cy="470" r="330"/><circle cx="600" cy="470" r="410"/>
  </g>
  <path d="M362 727 A320 320 0 1 1 830 760 L880 812" fill="none" stroke="#bdcad9" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
